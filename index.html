<body class="bg-white font-sans overflow-hidden text-sm text-gray-800">

  <!-- Main App Container -->
  <div id="app" class="flex h-screen w-full relative"></div>

  <!-- Dropdown Portal -->
  <div id="dropdown-root"></div>

  <!-- Modal Portal -->
  <div id="modal-root"></div>

  <!-- Toast Portal -->
  <div id="toast-root" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 pointer-events-none"></div>

  <script type="module">
    // --- FIREBASE IMPORTS & SETUP ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Replaced with specific config from provided image
    const firebaseConfig = {
      apiKey: "AIzaSyA6Ik6O_hlE3Tx8KyB-fi8_oaGTm2KiCw4",
      authDomain: "project-study-workspace.firebaseapp.com",
      projectId: "project-study-workspace",
      storageBucket: "project-study-workspace.firebasestorage.app",
      messagingSenderId: "561086809918",
      appId: "1:561086809918:web:53ef4a4803e8308ca74e6f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const stateDocRef = doc(db, "workspaces", "global_state");

    // --- UTILITIES & XSS PREVENTION ---
    function escapeHTML(str) {
      if (typeof str !== 'string') return str;
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag]));
    }

    function getInitials(name) {
      if (!name) return '';
      const words = name.trim().split(/\s+/);
      if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
      return (words[0][0] + words[words.length - 1][0]).toUpperCase();
    }

    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }

    function parseLocalDate(dateString) {
      if (!dateString) return new Date();
      const [y, m, d] = dateString.split('-');
      return new Date(y, m - 1, d);
    }

    function getDays(start, end) {
      if(!start || !end) return 0;
      const s = parseLocalDate(start);
      const e = parseLocalDate(end);
      return Math.max(0, Math.ceil((e - s) / 86400000) + 1);
    }

    function getWorkDays(start, end) {
      if(!start || !end) return 0;
      let count = 0;
      let cur = parseLocalDate(start);
      const e = parseLocalDate(end);
      while(cur <= e) {
        const day = cur.getDay();
        if(day !== 0 && day !== 6) count++;
        cur.setDate(cur.getDate() + 1);
      }
      return count;
    }

    const debouncedRenderSearch = debounce(() => renderApp(true), 250);

    // --- CONSTANTS & DEFAULT DATA ---
    const APPROVAL_OPTIONS = {
      approved: { label: 'Approved', color: 'bg-green-500' },
      revisions: { label: 'Revisions', color: 'bg-yellow-400' },
      submitted: { label: 'Submitted', color: 'bg-blue-400' },
      drafting: { label: 'Drafting', color: 'bg-blue-600' },
      empty: { label: '', color: 'bg-gray-200' }
    };

    const PRIORITY_OPTIONS = {
      critical: { label: 'Critical/Overdue', color: 'bg-red-500' },
      high: { label: 'High', color: 'bg-orange-500' },
      low: { label: 'Low', color: 'bg-gray-500' },
      empty: { label: '', color: 'bg-gray-200' }
    };

    const PEOPLE_OPTIONS = [
      { id: 'JB', name: 'Justine Ian Baylon', color: 'bg-indigo-500' },
      { id: 'MB', name: 'Mark Ballesteros', color: 'bg-emerald-500' },
      { id: 'RC', name: 'Rhodylie Kiana Caraniwan', color: 'bg-amber-500' },
      { id: 'ALL', name: 'All Members', color: 'bg-blue-500' },
      { id: '', name: 'Unassigned', color: 'bg-gray-300' }
    ];

    let appState = {
      activeWorkspace: 1,
      workspaces: {}
    };

    let state = null;
    let currentFileHandle = null; 

    function setupWorkspaces(baseData) {
      for (let i = 1; i <= 10; i++) {
        appState.workspaces[i] = JSON.parse(JSON.stringify(baseData));
        appState.workspaces[i].boardTitle = `Group ${i} - Project Study 1`;
        if (!appState.workspaces[i].people) {
          appState.workspaces[i].people = JSON.parse(JSON.stringify(PEOPLE_OPTIONS));
        }
      }
    }

    // Attempt local storage migration just to get the base data if needed before Firebase overrides it
    try {
      const localStateV8 = localStorage.getItem('project_study_1_v8_state');
      const localStateV7 = localStorage.getItem('project_study_1_v7_state');
      
      if (localStateV8) {
        appState = JSON.parse(localStateV8);
      } else if (localStateV7) {
        appState = JSON.parse(localStateV7);
      } else {
        const savedStateTag = document.getElementById('app-state');
        if (savedStateTag && savedStateTag.textContent !== 'null') {
          const savedState = JSON.parse(savedStateTag.textContent);
          
          if (savedState && savedState.workspaces) {
            appState = savedState;
          } else if (savedState && savedState.groups) {
            setupWorkspaces(savedState);
            appState.workspaces[1] = savedState;
            appState.activeWorkspace = 1;
          }
        }
      }
    } catch (e) {
      console.log("Starting with default data fallback.", e);
    }
    
    state = appState.workspaces[appState.activeWorkspace];
    document.title = state.boardTitle + " - Monday Workspace";

    // --- FIREBASE SAVING/LOADING LOGIC ---
    let saveTimeout;
    function saveState() {
      console.log("Saving state locally...");
      try {
        localStorage.setItem('project_study_1_v8_state', JSON.stringify(appState));
      } catch (e) {
        console.warn("Local save failed", e);
      }

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        console.log("Pushing to Firebase...");
        try {
          await setDoc(stateDocRef, appState);
          console.log("Successfully saved to Firebase!");
        } catch (e) {
          console.error("Cloud Save error: ", e);
          showToast("Cloud sync failed. Data saved locally.");
        }
      }, 500);
    }

    let isFirstLoad = true;
    onSnapshot(stateDocRef, (docSnap) => {
      console.log("Firebase sync triggered.");
      if (docSnap.exists()) {
        const newData = docSnap.data();
        
        // Prevent re-rendering if this snapshot was triggered by our own local typing
        if (JSON.stringify(appState) !== JSON.stringify(newData)) {
            appState = newData;
            state = appState.workspaces[appState.activeWorkspace];
            document.title = state.boardTitle + " - Monday Workspace";
            renderApp(true);
        }
      } else {
        // Brand new database! Seed it with our migrated local state.
        console.log("Empty database found. Seeding initial data...");
        setDoc(stateDocRef, appState);
      }
      
      if (isFirstLoad) {
        showToast("Connected to Cloud Workspace!");
        renderApp();
        isFirstLoad = false;
      }
    });

    // --- UI/UX FUNCTIONS ---
    function showToast(message) {
      const toastRoot = document.getElementById('toast-root');
      if (!toastRoot) return;
      const toast = document.createElement('div');
      toast.className = 'bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl text-sm font-medium transition-all duration-300 opacity-0 translate-y-4 z-[200]';
      toast.textContent = message;
      toastRoot.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', 'translate-y-4');
        toast.classList.add('opacity-100', 'translate-y-0');
      });

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-4');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function closeAllDropdowns() {
      const dropdownRoot = document.getElementById('dropdown-root');
      if (dropdownRoot) dropdownRoot.innerHTML = '';
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const modal = document.getElementById('modal-content');
      if (backdrop && modal) {
          backdrop.classList.replace('opacity-100', 'opacity-0');
          modal.classList.replace('scale-100', 'scale-95');
          setTimeout(() => {
              document.getElementById('modal-root').innerHTML = '';
          }, 300);
      } else {
          document.getElementById('modal-root').innerHTML = '';
      }
    }

    function getGroup(groupId) {
      return state.groups.find(g => g.id === groupId);
    }

    function getTask(groupId, taskId) {
      const group = getGroup(groupId);
      return group ? group.tasks.find(t => t.id === taskId) : null;
    }

    async function saveAndDownloadHTML() {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      closeAllDropdowns();
      
      const appRoot = document.getElementById('app');
      appRoot.innerHTML = '';
      document.getElementById('dropdown-root').innerHTML = '';
      document.getElementById('modal-root').innerHTML = '';
      document.getElementById('toast-root').innerHTML = '';

      const stateScript = document.getElementById('app-state');
      const serializedState = JSON.stringify(appState).replace(/<\/script>/g, '<\\/script>');
      stateScript.textContent = serializedState;

      const htmlContent = '<!DOCTYPE html>\n<html lang="en">\n' + document.documentElement.innerHTML + '\n</html>';
      
      renderApp();

      const fileName = (state.boardTitle || 'workspace').replace(/[^a-z0-9]/gi, '_').toLowerCase() + '_workspace.html';
      
      try {
        if (window.showSaveFilePicker) {
          if (!currentFileHandle) {
            currentFileHandle = await window.showSaveFilePicker({
              suggestedName: fileName,
              types: [{ description: 'HTML Document', accept: { 'text/html': ['.html'] } }],
            });
          }
          try {
            const writable = await currentFileHandle.createWritable();
            await writable.write(htmlContent);
            await writable.close();
            showToast(`State saved successfully!`);
          } catch (writeErr) {
            console.warn("Write failed, prompting for new location.", writeErr);
            currentFileHandle = await window.showSaveFilePicker({
              suggestedName: fileName,
              types: [{ description: 'HTML Document', accept: { 'text/html': ['.html'] } }],
            });
            const writable = await currentFileHandle.createWritable();
            await writable.write(htmlContent);
            await writable.close();
            showToast(`State saved successfully to new location!`);
          }
        } else {
          const blob = new Blob([htmlContent], { type: 'text/html' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast(`State saved successfully! Downloaded: ${fileName}`);
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.error("Save error:", err);
          showToast('Failed to save the file.');
          currentFileHandle = null; 
        }
      }
    }

      const group = getGroup(targetGroupId);
      const today = new Date();
      const twoDaysLater = new Date(today.getTime() + 86400000 * 2);

        startDate: today.toISOString().split('T')[0],

    function addGroup() {
      const colors = ['#00c875', '#fdab3d', '#e2445c', '#0086c0', '#784bd1', '#14b8a6'];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      state.groups.push({

        color: randomColor,
        isExpanded: true,
        tasks: []
      });
      saveState();

    }

    function duplicateTask(groupId, taskId) {
      const group = getGroup(groupId);
      if (group) {
        const taskIndex = group.tasks.findIndex(t => t.id === taskId);
        if (taskIndex !== -1) {
          const duplicatedTask = JSON.parse(JSON.stringify(group.tasks[taskIndex]));
          duplicatedTask.id = `t${Date.now()}`;
          duplicatedTask.name = `${duplicatedTask.name} (Copy)`;
          group.tasks.splice(taskIndex + 1, 0, duplicatedTask);
          saveState();
          renderApp();
          showToast("Task duplicated");
        }
      }
    }

    function deleteTask(groupId, taskId) {
      const group = getGroup(groupId);
      if (group) {
        group.tasks = group.tasks.filter(t => t.id !== taskId);
        saveState();
        renderApp();
        showToast("Task deleted");
      }
    }

    function executeDeleteGroup(groupId) {
      state.groups = state.groups.filter(g => g.id !== groupId);
      saveState();
      renderApp();
      showToast("Group deleted");
      closeModal();
    }

    function getDisplayGroups() {
      return state.groups.map(group => {
        let filteredTasks = group.tasks.filter(task => {
          const matchesSearch = task.name.toLowerCase().includes(state.searchQuery.toLowerCase());
          const matchesPerson = state.personFilter ? task.person === 'RC' : true;
          const matchesActive = state.activeFilter ? task.approvalStatus !== 'approved' && task.approvalStatus !== 'empty' : true;
          return matchesSearch && matchesPerson && matchesActive;
        });

        if (state.sortOrder === 'asc') filteredTasks.sort((a, b) => a.name.localeCompare(b.name));
        else if (state.sortOrder === 'desc') filteredTasks.sort((a, b) => b.name.localeCompare(a.name));

        return { ...group, tasks: filteredTasks };
      });
    }

    function buildGroupProgressBar(tasks) {
      if (tasks.length === 0) return `<div class="h-6 w-full bg-gray-100 rounded-full"></div>`;
      
      const counts = tasks.reduce((acc, task) => {
        acc[task.approvalStatus] = (acc[task.approvalStatus] || 0) + 1;
        return acc;
      }, {});

      const sortedStatuses = Object.keys(counts).sort((a, b) => {
        const order = { 'approved': 1, 'revisions': 2, 'submitted': 3, 'drafting': 4, 'empty': 5 };
        return (order[a] || 99) - (order[b] || 99);
      });

      let bars = sortedStatuses.map(status => {
        const width = (counts[status] / tasks.length) * 100;
        const color = APPROVAL_OPTIONS[status].color;
        const label = APPROVAL_OPTIONS[status].label || 'Empty';
        return `<div style="width: ${width}%" class="h-full ${color} transition-all duration-300" title="${escapeHTML(label)}: ${counts[status]}"></div>`;
      }).join('');

      return `<div class="h-full w-full flex rounded overflow-hidden shadow-sm">${bars}</div>`;
    }

    function buildGanttView() {
      const displayGroups = getDisplayGroups();
      const tasks = displayGroups
        .flatMap(g => g.tasks.map(t => ({...t, groupColor: g.color})))
        .filter(t => t.startDate && t.endDate);
      
      if (tasks.length === 0) {
        return `<div class="p-8 text-gray-500 text-center mt-10">No tasks with start and end dates available for the timeline.</div>`;
      }

      const minTime = Math.min(...tasks.map(t => parseLocalDate(t.startDate).getTime()));
      const maxTime = Math.max(...tasks.map(t => parseLocalDate(t.endDate).getTime()));
      
      const start = new Date(minTime); start.setDate(start.getDate() - 5);
      const end = new Date(maxTime); end.setDate(end.getDate() + 5);
      
      const totalDaysRaw = Math.ceil((end.getTime() - start.getTime()) / 86400000);
      const totalDays = Math.min(totalDaysRaw, 90); 
      
      const days = [];
      for(let i = 0; i <= totalDays; i++) {
        days.push(new Date(start.getTime() + i * 86400000));
      }

      let html = `
        <div class="w-full min-h-full px-8 py-4 bg-white">
          <div class="min-w-max border border-gray-200 rounded bg-white shadow-sm inline-block">
            <div class="flex border-b border-gray-200 bg-gray-50 sticky top-0 z-[15] shadow-sm select-none">
              <div class="w-64 shrink-0 border-r border-gray-200 p-3 font-medium text-gray-700 bg-gray-50 sticky left-0 z-20 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
                Task Name
              </div>
              <div class="flex">
      `;

      const todayStr = new Date().toDateString();
      days.forEach(d => {
        const isWeekend = d.getDay() === 0 || d.getDay() === 6;
        const isToday = d.toDateString() === todayStr;
        const dayName = d.toLocaleDateString('en-US', { weekday: 'narrow' });
        
        html += `
          <div class="w-12 shrink-0 border-r border-gray-200 p-2 text-xs text-center flex flex-col items-center justify-center ${isWeekend ? 'bg-gray-100' : ''}">
            <span class="text-gray-400">${dayName}</span>
            <span class="font-semibold ${isToday ? 'bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center mt-1' : 'text-gray-700 mt-1'}">
              ${d.getDate()}
            </span>
          </div>
        `;
      });

      html += `</div></div>`; 

      tasks.forEach(task => {
        const taskStart = parseLocalDate(task.startDate).getTime();
        const taskEnd = parseLocalDate(task.endDate).getTime();
        const leftOffset = Math.max(0, (taskStart - start.getTime()) / 86400000);
        const duration = Math.max(1, (taskEnd - taskStart) / 86400000 + 1);
        
        if (leftOffset > totalDays) return;

        html += `
          <div class="flex border-b border-gray-100 hover:bg-gray-50 group">
            <div class="w-64 shrink-0 border-r border-gray-200 p-3 text-sm truncate flex items-center gap-2 bg-white group-hover:bg-gray-50 sticky left-0 z-[10] shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)] select-none">
              <div class="w-3 h-3 rounded-full shrink-0" style="background-color: ${escapeHTML(task.groupColor)}"></div>
              <span class="truncate transition-colors">${escapeHTML(task.name)}</span>
            </div>
            <div class="flex-1 relative flex overflow-hidden">
        `;

        days.forEach(d => {
          const isWeekend = d.getDay() === 0 || d.getDay() === 6;
          html += `<div class="w-12 shrink-0 border-r border-gray-100 h-12 ${isWeekend ? 'bg-gray-50' : ''}"></div>`;
        });

        html += `
              <div 
                class="absolute top-2 h-8 rounded shadow flex items-center px-3 text-xs text-white font-medium truncate transition-all opacity-90 hover:opacity-100 hover:shadow-md select-none"
                style="left: ${leftOffset * 3}rem; width: ${duration * 3}rem; background-color: ${escapeHTML(task.groupColor)}"
                title="${escapeHTML(task.name)} (${task.startDate} to ${task.endDate})"
              >
                ${escapeHTML(task.name)}
              </div>
            </div>
          </div>
        `;
      });

      html += `</div></div>`;
      return html;
    }

    function buildDashboardView() {

      const draftingTasks = allTasks.filter(t => t.approvalStatus === 'drafting').length;
      const revisionsTasks = allTasks.filter(t => t.approvalStatus === 'revisions').length;
      
      const completionRate = totalTasks > 0 ? Math.round((approvedTasks / totalTasks) * 100) : 0;

      const workload = {};
      state.people.forEach(p => workload[p.id] = { name: p.name, color: p.color, count: 0 });
      allTasks.forEach(t => {
        if (t.person && workload[t.person]) {
          workload[t.person].count++;
        }
      });

      let workloadHtml = Object.values(workload)
        .filter(w => w.name !== 'Unassigned' && w.count > 0)
        .sort((a,b) => b.count - a.count)
        .map(w => `
          <div class="flex items-center justify-between p-3 bg-gray-50 rounded border border-gray-100 mb-2">

            <div class="bg-white px-3 py-1 rounded shadow-sm border border-gray-200 text-sm font-semibold">${w.count} Tasks</div>
          </div>
        `).join('');

      if (!workloadHtml) workloadHtml = `<div class="text-gray-500 text-sm italic">No tasks assigned yet.</div>`;

      return `
        <div class="px-8 py-4 min-h-full bg-gray-50 w-full">
          <h2 class="text-2xl font-bold text-gray-800 mb-6">Project Dashboard</h2>
          
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">

                <div class="bg-green-500 h-2.5 rounded-full transition-all duration-1000" style="width: ${completionRate}%"></div>
              </div>
            </div>
            
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
              <div class="text-gray-500 text-sm font-medium mb-1 uppercase tracking-wider">Total Tasks</div>
              <div class="text-4xl font-bold text-gray-900 mb-1">${totalTasks}</div>
              <div class="text-sm text-gray-500">Across ${displayGroups.length} Active Phases</div>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col justify-center">
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm text-gray-600 flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-green-500"></div> Approved</span>
                <span class="font-bold text-gray-800">${approvedTasks}</span>
              </div>
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm text-gray-600 flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-yellow-400"></div> Revisions</span>
                <span class="font-bold text-gray-800">${revisionsTasks}</span>
              </div>
              <div class="flex justify-between items-center">
                <span class="text-sm text-gray-600 flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-blue-600"></div> Drafting</span>
                <span class="font-bold text-gray-800">${draftingTasks}</span>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
              <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2"><i data-lucide="users" class="w-5 h-5 text-gray-400"></i> Team Workload</h3>

        return;
      }

      const action = target.dataset.action;
      const groupId = target.dataset.groupId;
      const taskId = target.dataset.taskId;

      switch(action) {
        case 'switch-workspace':
          appState.activeWorkspace = parseInt(target.dataset.workspaceId, 10);
          state = appState.workspaces[appState.activeWorkspace];
          document.title = state.boardTitle + " - Monday Workspace";
          saveState();
          renderApp();

      const groupId = target.dataset.groupId;
      const taskId = target.dataset.taskId;
      const val = target.value;

      if (action === 'search') {
        state.searchQuery = val;
        debouncedRenderSearch();
      } else if (action === 'update-board-title') {
        state.boardTitle = val;
        document.title = val + " - Monday Workspace";
        saveState();
      } else if (action === 'update-project-lead') {
        state.projectLead = val;
        saveState();
      } else if (action === 'update-group-title') {
        const group = getGroup(groupId);
        if (group) { group.title = val; saveState(); }
      } else if (action === 'update-task-text') {
        const task = getTask(groupId, taskId);
        if (task) { task[target.dataset.field] = val; saveState(); }
      } else if (action === 'update-person-name') {
        const person = state.people.find(p => p.id === target.dataset.personId);
        if (person) { person.name = val; saveState(); }
      }
    });

    document.addEventListener('change', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      
      const action = target.dataset.action;
      const groupId = target.dataset.groupId;
      const taskId = target.dataset.taskId;
      const val = target.value;

      if (action === 'update-group-color') {
        updateGroupColor(groupId, val);
      } else if (action === 'update-task-start') {
        updateTask(groupId, taskId, 'startDate', val);
      } else if (action === 'update-task-end') {
        updateTask(groupId, taskId, 'endDate', val);
      } else if (action === 'update-project-start') {
        state.projectStart = val;
        saveState();
        renderApp();
      } else if (action === 'update-person-name' || action === 'update-project-lead') {
        saveState();
        renderApp(); 
      }
    });

    document.addEventListener('scroll', (e) => {
      if (e.target && e.target.closest && (e.target.closest('#dropdown-root') || e.target.closest('#modal-root'))) return;
      closeAllDropdowns();
    }, { capture: true, passive: true });

  </script>
</body>
</html>
